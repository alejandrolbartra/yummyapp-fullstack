<div class="isolate bg-gray-900 px-6 py-24 sm:py-32 lg:px-8">
  <div aria-hidden="true" class="absolute inset-x-0 -top-40 -z-10 transform-gpu overflow-hidden blur-3xl sm:-top-80">
    <div style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)"
         class="relative left-1/2 -z-10 aspect-1155/678 w-144.5 max-w-none -translate-x-1/2 rotate-30 bg-gradient-to-tr from-[#ff80b5] to-[#9089fc] opacity-20 sm:left-[calc(50%-40rem)] sm:w-288.75"></div>
  </div>

  <div class="mx-auto max-w-md text-center">
    <h2 class="text-4xl font-semibold tracking-tight text-white sm:text-5xl">Login</h2>
    <p class="mt-2 text-lg text-gray-400">Access your account securely</p>
  </div>

  <form (ngSubmit)="onLogin()" class="mx-auto mt-16 max-w-sm sm:mt-20">
    <div class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-semibold text-white">Email</label>
        <div class="mt-2.5">
          <input id="email" type="email" name="username" [(ngModel)]="username" required
                 class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-white">Password</label>
        <div class="mt-2.5">
          <input id="password" type="password" name="password" [(ngModel)]="password" required
                 class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white placeholder:text-gray-500 outline-1 -outline-offset-1 outline-white/10 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
        </div>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center text-sm text-gray-400">
          <input type="checkbox" name="remember" class="mr-2 rounded bg-white/5 text-indigo-500 focus:ring-indigo-500" />
          Remember me
        </label>
        <a href="#" class="text-sm font-semibold text-indigo-400 hover:text-indigo-300">Forgot password?</a>
      </div>
    </div>

    <div class="mt-10">
      <button type="submit"
              class="block w-full rounded-md bg-indigo-500 px-3.5 py-2.5 text-center text-sm font-semibold text-white shadow-xs hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">
        Sign in
      </button>
    </div>

    <p *ngIf="errorMessage" class="mt-4 text-sm text-red-400 text-center">{{ errorMessage }}</p>
  </form>


</div>
