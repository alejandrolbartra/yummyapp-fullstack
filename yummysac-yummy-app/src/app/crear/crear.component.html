<div class="px-6 py-10 bg-gray-100 min-h-screen">
  <div class="max-w-xl mx-auto bg-white shadow-md rounded-lg p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Crear Usuario</h2>
    <p class="text-sm text-gray-500 mb-6">Completa los campos para registrar un nuevo usuario.</p>

    <form>
      <div class="space-y-6">
        <div>
          <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
          <input
            id="nombre"
            type="text"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
            placeholder="Ej. Ana Gómez"
          />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input
            id="email"
            type="email"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
            placeholder="Ej. ana@example.com"
          />
        </div>

        <div>
          <label for="rol" class="block text-sm font-medium text-gray-700">Rol</label>
          <select
            id="rol"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
          >
            <option value="">Selecciona un rol</option>
            <option value="Admin">Admin</option>
            <option value="Usuario">Usuario</option>
          </select>
        </div>
      </div>

      <div class="mt-8 flex justify-end gap-4">
        <a
          routerLink="/listado"
          class="inline-block px-4 py-2 text-sm text-gray-600 hover:text-gray-800"
        >
          Cancelar
        </a>
        <button
          type="submit"
          class="inline-block rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
