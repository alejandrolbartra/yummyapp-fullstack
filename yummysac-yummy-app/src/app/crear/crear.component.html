<div class="px-6 py-10 bg-gray-100 min-h-screen">
  <div class="max-w-xl mx-auto bg-white shadow-md rounded-lg p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Registrar Nuevo Usuario</h2>
    <p class="text-sm text-gray-500 mb-6">Completa los campos para crear un nuevo usuario.</p>

    <form (ngSubmit)="registrarUsuario()" #registroForm="ngForm">
      <div class="space-y-6">
        <div>
          <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
          <input
            id="nombre"
            type="text"
            name="nombre"
            [(ngModel)]="nuevoUsuario.nombre"
            required
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
            placeholder="Ej. Ana"
          />
        </div>

        <div>
          <label for="apellido" class="block text-sm font-medium text-gray-700">Apellido</label>
          <input
            id="apellido"
            type="text"
            name="apellido"
            [(ngModel)]="nuevoUsuario.apellido"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
            placeholder="Ej. Gómez"
          />
        </div>

        <div>
          <label for="correo" class="block text-sm font-medium text-gray-700">Correo</label>
          <input
            id="correo"
            type="email"
            name="correo"
            [(ngModel)]="nuevoUsuario.correo"
            required
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
            placeholder="Ej. ana@example.com"
          />
        </div>

        <div>
          <label for="pass" class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input
            id="pass"
            type="password"
            name="pass"
            [(ngModel)]="nuevoUsuario.pass"
            required
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
          />
        </div>

        <div>
          <label for="rol" class="block text-sm font-medium text-gray-700">Rol</label>
          <input
            id="rol"
            type="text"
            name="rol"
            [(ngModel)]="nuevoUsuario.rol"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
            placeholder="Ej. Cliente"
          />
        </div>
      </div>

      <div class="mt-8 flex justify-end gap-4">
        <a
          routerLink="/listado"
          class="inline-block px-4 py-2 text-sm text-gray-600 hover:text-gray-800"
        >
          Cancelar
        </a>
        <button
          type="submit"
          [disabled]="!registroForm.form.valid"
          class="inline-block rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
