spring:
  application:
    name: demo

  datasource:
    url: jdbc:mysql://localhost:3306/bdAppYummy
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: motorola
    hikari:
      maximum-pool-size: 14
      minimum-idle: 4
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        format_sql: true